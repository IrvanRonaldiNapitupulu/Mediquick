name: mediquick
description: "MediQuick - Aplikasi Layanan Kesehatan & Apotek Online"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  carousel_slider: ^4.2.1
  url_launcher: ^6.3.1
  http: ^1.4.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  geolocator: ^14.0.1
  intl: ^0.20.2
  geocoding: ^4.0.0
  webview_flutter: ^4.13.0
  youtube_player_iframe: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
